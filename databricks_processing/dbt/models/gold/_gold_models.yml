version: 2

models:
  - name: dim_product
    description: "Dim sản phẩm SCD1. Surrogate product_key=md5(product_id)."
    columns:
      - name: product_key
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Dim ngày, attribute immutable."
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_user_current
    description: "Trạng thái hiện tại của user (snapshot source cho SCD2)."
    columns:
      - name: user_id
        tests:
          - unique
          - not_null
      - name: lifetime_segment
        tests:
          - accepted_values:
              arguments:
                values: [Prospect, VIP, Newbie, Regular, Churning]

  - name: fact_daily_performance
    description: "Grain: (date_key, brand, main_category)."
    columns:
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: total_gmv
        tests:
          - not_null

  - name: fact_user_funnel
    description: "Grain: (date_key, product_id, user_session). FK product_key, user_id, date_key."
    columns:
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: user_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_user_snapshot')
                field: user_id
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_rfm_segmentation
    description: "Grain: (user_id, calc_date). FK user_id -> dim_user_snapshot."
    columns:
      - name: user_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_user_snapshot')
                field: user_id
      - name: customer_segment
        tests:
          - accepted_values:
              arguments:
                values: [VIP, Newbie, Regular, Churning]

snapshots:
  - name: dim_user_snapshot
    description: "dim_user SCD2 trên lifetime_segment."
    columns:
      - name: user_id
        tests:
          - not_null
