version: 2

models:
  - name: silver_events
    description: "Events sạch: bot/spam anti-join, cast/impute/split category, price>0."
    columns:
      - name: _row_hash
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: event_time
        tests:
          - not_null
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                # 4 event_type thật của dataset Rees46 e-commerce.
                values: [view, cart, remove_from_cart, purchase]
