# Databricks SQL Warehouse connection cho dbt.

cosmetics_platform:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      # http_path trỏ SQL warehouse (lấy từ Databricks → SQL Warehouses → Connection details).
      # Mặc định: Serverless Starter Warehouse (id 71f2704e13614d48) — đổi nếu warehouse khác.
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/71f2704e13614d48') }}"
      catalog: workspace
      schema: default
      threads: 4
