# Data Quality rule-sets (declarative). Mỗi key = 1 rule_set truyền vào run_gate().
# Rule types: no_nulls, unique, range, row_count_at_least, allowed_values,
#             referential_integrity, custom_sql

bronze:
  - rule: row_count_at_least
    name: bronze_has_data
    min: 1
  # Bảng clean bronze: quarantine đã loại null → gate này chứng minh NULL guard hoạt động.
  - rule: no_nulls
    name: bronze_no_null_keys
    columns: [user_id, product_id]

silver:
  - rule: row_count_at_least
    name: silver_has_data
    min: 1
  - rule: no_nulls
    name: silver_no_nulls
    columns: [user_id, product_id, event_time]
  - rule: unique
    name: silver_no_dup_row_hash
    columns: [_row_hash]
  - rule: range
    name: silver_price_positive
    column: price
    min: 0
  - rule: allowed_values
    name: silver_event_type_domain
    column: event_type
    values: [view, cart, purchase]

dim_product:
  - rule: no_nulls
    columns: [product_key, product_id]
  - rule: unique
    columns: [product_key]
  - rule: unique
    name: product_natural_key_unique
    columns: [product_id]

dim_user:
  - rule: no_nulls
    columns: [user_key, user_id, valid_from]
  - rule: unique
    columns: [user_key]
  - rule: allowed_values
    column: is_current
    values: [true, false]

dim_date:
  - rule: no_nulls
    columns: [date_key]
  - rule: unique
    columns: [date_key]

fact_daily_performance:
  - rule: row_count_at_least
    min: 1
  - rule: range
    name: gmv_non_negative
    column: total_gmv
    min: 0
  - rule: range
    name: orders_non_negative
    column: total_orders
    min: 0
  - rule: referential_integrity
    name: fk_date
    child_columns: [date_key]
    parent_table: workspace.gold_cosmetics.dim_date
    parent_columns: [date_key]

fact_user_funnel:
  - rule: row_count_at_least
    min: 1
  - rule: referential_integrity
    name: fk_product
    child_columns: [product_key]
    parent_table: workspace.gold_cosmetics.dim_product
    parent_columns: [product_key]
  - rule: referential_integrity
    name: fk_user
    child_columns: [user_key]
    parent_table: workspace.gold_cosmetics.dim_user
    parent_columns: [user_key]
  - rule: referential_integrity
    name: fk_date
    child_columns: [date_key]
    parent_table: workspace.gold_cosmetics.dim_date
    parent_columns: [date_key]

fact_rfm_segmentation:
  - rule: row_count_at_least
    min: 1
  - rule: range
    name: recency_non_negative
    column: recency
    min: 0
  - rule: range
    name: frequency_at_least_one
    column: frequency
    min: 1
  - rule: range
    name: monetary_non_negative
    column: monetary
    min: 0
  - rule: allowed_values
    name: segment_domain
    column: customer_segment
    values: [VIP, Newbie, Regular, Churning]
  - rule: referential_integrity
    name: fk_user
    child_columns: [user_key]
    parent_table: workspace.gold_cosmetics.dim_user
    parent_columns: [user_key]
