groups:
  - name: airflow
    rules:
      # Scheduler không heartbeat trong 2 phút -> khả năng scheduler treo.
      - alert: AirflowSchedulerDown
        expr: rate(airflow_scheduler_heartbeat[2m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Airflow scheduler không heartbeat"
          description: "Không nhận scheduler_heartbeat trong 2 phút."

      # Task fail rate cao.
      - alert: AirflowTaskFailures
        expr: sum(rate(airflow_task_failures_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Airflow có task thất bại"
          description: "Tỷ lệ task failure > 0 trong 5 phút qua."

      # DAG run chạy quá chậm (> 30 phút).
      - alert: AirflowDagRunSlow
        expr: avg(airflow_dag_run_duration_seconds_bucket) > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DAG run kéo dài > 30 phút"
