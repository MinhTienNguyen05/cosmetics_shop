global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: statsd-exporter
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Kafka JMX exporter (optional): bật jmx-exporter sidecar cho kafka-* thì bỏ comment.
  # - job_name: kafka
  #   static_configs:
  #     - targets: ["kafka-1:7071", "kafka-2:7071", "kafka-3:7071"]
