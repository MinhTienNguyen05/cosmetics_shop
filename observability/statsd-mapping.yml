# statsd-exporter mapping: convert Airflow 2.7 statsd metrics -> Prometheus.
#
# Định dạng THẬT (verify --log.level=debug): prefix=airflow, separator=".",
# dag_id/task_id/state EMBED trong tên. type: |c counter, |ms timer, |g gauge.
#
# LƯU Ý statsd-exporter v0.26: glob multi-wildcard (airflow.dag.*.*.duration,
# airflow.ti.finish.*.*.*) KHÔNG match qua UDP (FSM backtracking fail). Chỉ
# exact + glob 1-wildcard match. -> dùng REGEX anchored cho mọi pattern multi-segment.
# KHÔNG dùng fallback tổng hợp (gauge+counter+timer -> "already registered" conflict).
defaults:
  ttl: 86400

mappings:
  # Scheduler heartbeat (counter)
  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat"

  # Task duration (ms timer) -> histogram giây: airflow.dag.<dag>.<task>.duration
  - match: '^airflow\.dag\.([^.]+)\.([^.]+)\.duration$'
    match_type: "regex"
    name: "airflow_task_duration_seconds"
    labels:
      dag_id: "$1"
      task_id: "$2"
    timer_type: "histogram"

  # Task instance finish (counter): airflow.ti.finish.<dag>.<task>.<state>
  - match: '^airflow\.ti\.finish\.([^.]+)\.([^.]+)\.(failed|success|up_for_retry|upstream_failed|skipped)$'
    match_type: "regex"
    name: "airflow_task_finish_total"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"

  # Executor gauges: airflow.executor.<state>
  - match: "airflow.executor.*"
    name: "airflow_executor"
    labels:
      state: "$1"

  # Scheduler task gauges: airflow.scheduler.tasks.<state>
  - match: "airflow.scheduler.tasks.*"
    name: "airflow_scheduler_tasks"
    labels:
      state: "$1"

  # DAG processing duration theo dag file (ms timer)
  - match: '^airflow\.dag_processing\.last_duration\.([^.]+)$'
    match_type: "regex"
    name: "airflow_dag_processing_duration_seconds"
    labels:
      dag_file: "$1"
    timer_type: "histogram"
